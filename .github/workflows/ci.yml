name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Dependency audit
        run: pip-audit -r app/requirements.txt
      - name: Test with coverage gate
        run: pytest --cov --cov-fail-under=80 --cov-report=term-missing

  build-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t task-api:${{ github.sha }} app
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: task-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      # Week 2: log in to Azure via OIDC and push this image to ACR on pushes to main.
